name: PR Validate

on:
  pull_request:
    types: [edited, opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-edit-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate PR
    if: (! github.event.pull_request.draft)
    permissions:
      pull-requests: write
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.pr-validate.yml@a11ad3d1b9288fb40757c4314a62eb86ff227931 # v1.2.1
    with:
      markdown_links: |
        - [Frontend](https://${{ github.event.repository.name }}-${{ github.event.number }}.apps.silver.devops.gov.bc.ca)
        - [Backend](https://${{ github.event.repository.name }}-${{ github.event.number }}.apps.silver.devops.gov.bc.ca/api)

  crunchy-values-drift:
    name: Crunchy Values Drift
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      # charts/crunchy/values-prod.yml is a full copy of values.yml because
      # action-crunchy takes a single values file, so there is no overlay to
      # layer a one-line override onto. Duplicating a database config is only
      # safe if the copies cannot silently diverge - storage class, backup
      # config or the Postgres version drifting between environments is the
      # failure this guards. Only the replica count may differ.
      - name: Fail if the two files differ outside the replica count
        run: |
          DIFF=$(diff <(grep -vE '^\s*#' charts/crunchy/values.yml) \
                      <(grep -vE '^\s*#' charts/crunchy/values-prod.yml) || true)
          UNEXPECTED=$(echo "${DIFF}" | grep -E '^[<>]' | grep -vE 'replicas:' || true)
          if [ -n "${UNEXPECTED}" ]; then
            echo "::error title=Crunchy values drift::values.yml and values-prod.yml differ outside the replica count. Keep them identical except for crunchy.instances.replicas."
            echo "${UNEXPECTED}"
            exit 1
          fi
          echo "Only the replica count differs:"
          echo "${DIFF}" | grep -E '^[<>]' || echo "  (identical)"

  results:
    name: Validate Results
    if: always()
    needs: [validate, crunchy-values-drift]
    runs-on: ubuntu-slim
    steps:
      - run: echo "Success!"
